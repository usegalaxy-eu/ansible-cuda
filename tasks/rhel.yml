---
- name: Verify kernel settings
  block:
    - name: Disabling Nouveau
      copy:
        src: blacklist-nouveau.conf
        dest: /usr/lib/modprobe.d/blacklist-nouveau.conf
        owner: root
        group: root
        mode: '0644'

    - name: Regenerate the kernel initramfs
      command: dracut --force

    - name: Verify the System has the Kernel Headers and Development Packages Installed
      package:
        name: "{{ packages }}"
        state: installed
      vars:
        packages:
          - kernel-devel
          - kernel-headers

- name: Set Cuda repositories for RHEL 7 and install it
  block:
    - name: Add Cuda gpg key (Centos 7)
      rpm_key:
        state: present
        key: "{{ cuda_rhel7_gpg_key }}"

    - name: Install cuda repository meta-data (Centos 7)
      package:
        name: "{{ cuda_rhel7_url }}"
        state: installed

    - name: Install CUDA (RHEL 7)
      package:
        name: "{{ cuda_rhel7_package_name }}"
        state: installed
        update_cache: true
      when: install_cuda | bool
  when: ansible_distribution_major_version | int == 7

- name: Set Cuda repositories for RHEL 8 and install it
  block:
    - name: Enable cuda repository meta-data (RHEL 8)
      ansible.builtin.command:
        cmd: "dnf config-manager --add-repo {{ cuda_rhel8_url }}"

    - name: Install CUDA (RHEL 8)
      package:
        name: "{{ cuda_rhel8_package_name }}"
        state: installed
        update_cache: true
      when: install_cuda | bool
  when: ansible_distribution_major_version | int == 8

- name: Set Cuda repositories for RHEL 9 and install it
  when: ansible_distribution_major_version | int == 9
  block:
    - name: Enable cuda repository meta-data (RHEL 9)
      ansible.builtin.command:
        cmd: "dnf config-manager --add-repo {{ cuda_rhel9_url }}"
    - name: Install CUDA (RHEL 9)
      ansible.builtin.package:
        name: "{{ cuda_rhel9_package_name }}"
        state: installed
        update_cache: true
      when: install_cuda | bool
    - name: Update to latest nvidia driver
      ansible.builtin.dnf:
        name: '@nvidia-driver:latest-dkms'
        state: present
        allowerasing: true

- name: Set Cuda repositories for RHEL 10 and install it
  when: ansible_distribution_major_version | int == 10
  block:
    - name: Enable CRB and EPEL 10 repositories
      ansible.builtin.shell: |
        dnf config-manager --set-enabled crb
        dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
      changed_when: false

    - name: Add NVIDIA RHEL 10 Network Repository
      ansible.builtin.command:
        cmd: "dnf config-manager --add-repo {{ cuda_rhel10_url | default('https://developer.download.nvidia.com/compute/cuda/repos/rhel10/x86_64/cuda-rhel10.repo') }}"
      changed_when: false

    - name: Install Kernel Headers and Development packages (RHEL 10 style)
      ansible.builtin.dnf:
        name:
          - kernel-devel-matched
          - kernel-headers
        state: present

    - name: Clean DNF cache
      ansible.builtin.command: dnf clean expire-cache
      changed_when: false

    - name: Install NVIDIA Driver (Proprietary Method)
      ansible.builtin.dnf:
        name: nvidia-open
        state: present
        allowerasing: true
      register: driver_install

    - name: Install CUDA Toolkit
      ansible.builtin.dnf:
        name: "{{ cuda_rhel10_package_name | default('cuda') }}"
        state: present
        allowerasing: true
      when: install_cuda | bool
